<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анна Бобкова — портфолио</title>
<meta name="description" content="Портфолио Анны Бобковой: настольные игры, визуальная новелла, видео в нейросетях, лендинги и контент.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#1c1c1c}
  body{-webkit-text-size-adjust:100%;overflow-x:hidden}

  /* ---------- СТЕК: ни одного шва между блоками ---------- */
  .stack{display:block;width:100%;max-width:1792px;margin:0 auto;font-size:0;line-height:0}
  .block{position:relative;display:block;width:100%}
  .block img{display:block;width:100%;height:auto;border:0}

  /* видео-слой поверх белого прямоугольника */
  .slot{position:absolute;background:#000;overflow:hidden;display:none}
  .slot.on{display:block}
  .slot video{width:100%;height:100%;object-fit:cover;display:block;border:0}
  .slot::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)
  }

  /* кнопка Play, если видео ещё нет */
  .slot.empty{display:block;background:transparent;cursor:pointer}
  .slot.empty::before{
    content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:0;height:0;border-style:solid;
    border-width:clamp(14px,2.6vw,34px) 0 clamp(14px,2.6vw,34px) clamp(24px,4.5vw,58px);
    border-color:transparent transparent transparent rgba(255,255,255,.95);
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.45));
  }

  .hint{
    max-width:760px;margin:0 auto;padding:18px 16px 28px;
    font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#8f8f8f;text-align:center
  }
  .hint code{background:#2a2a2a;padding:1px 5px;border-radius:4px;color:#dddda1;font-size:13px}
</style>
</head>
<body>

<div class="stack" id="stack">

  <!-- 1. Обложка -->
  <div class="block" data-block="1">
    <img src="img/block-1.webp" alt="Анна Бобкова — AI-креатор и продюсер контента">
  </div>

  <!-- 2. Мини-игры и прохождение -->
  <div class="block" data-block="2">
    <img src="img/block-2.webp" alt="Мини-игры и прохождение визуальной новеллы">
    <!-- слоты видео задаются в скрипте ниже -->
  </div>

  <!-- 3. Видео в нейронках -->
  <div class="block" data-block="3">
    <img src="img/block-3.webp" alt="Видео, созданные в нейросетях: трейлер, видеоклип, рилс">
  </div>

  <!-- 4. Примеры проектов -->
  <div class="block" data-block="4">
    <img src="img/block-4.webp" alt="Примеры проектов: краудфандинг Frozen Frontier и игра для Сбербанка">
  </div>

  <!-- 5. Пример сайта предзаказа -->
  <div class="block" data-block="5">
    <img src="img/block-5.webp" alt="Пример сайта предзаказа настольной игры «Битва Ресторанов»">
  </div>

  <!-- 6. Посты в VK -->
  <div class="block" data-block="6">
    <img src="img/block-6.webp" alt="Посты в VK: битва ресторанов и блюда русской кухни">
  </div>

  <!-- 7. Опыт работы -->
  <div class="block" data-block="7">
    <img src="img/block-7.webp" alt="Опыт работы и образование">
  </div>

  <!-- 8. Финальный экран с контактами -->
  <div class="block" data-block="8">
    <img src="img/block-8.webp" alt="Если вам нужен человек, который придумает концепцию — напишите">
  </div>

</div>

<p class="hint">
  Видео: положите файлы в папку <code>img</code> с именами
  <code>v1.mp4</code>, <code>v2.mp4</code>… Координаты белых прямоугольников
  уже прописаны — видео встанет точно на своё место.
</p>

<script>
/* =====================================================================
   КАРТА ВИДЕО
   ---------------------------------------------------------------------
   Здесь перечислены все белые прямоугольники из макета.
   block  — номер блока (data-block выше)
   x, y, w, h — координаты в пикселях МАКЕТА (ширина макета 1792 px)
   src   — имя файла видео в папке img
   ---------------------------------------------------------------------
   Как только файл найден — он появится автоматически, ничего
   в HTML трогать не нужно. Если файла нет, останется белый
   прямоугольник с кнопкой Play (или сам скриншот).
   ===================================================================== */
const VIDEOS = [
  /* ============ БЛОК 2 · «МИНИ-ИГРЫ и прохождение» ============ */
  { block: 2, x: 205,  y: 505,  w: 690,  h: 400, src: 'v1.mp4' },
  { block: 2, x: 925,  y: 505,  w: 700,  h: 400, src: 'v2.mp4' },
  { block: 2, x: 205,  y: 944,  w: 690,  h: 400, src: 'v3.mp4' },
  { block: 2, x: 925,  y: 944,  w: 700,  h: 400, src: 'v4.mp4' },
  { block: 2, x: 208,  y: 1600, w: 1360, h: 470, src: 'v5.mp4' },

  /* ============ БЛОК 3 · «ВИДЕО в нейронках» ============ */
  { block: 3, x: 194,  y: 888,  w: 926, h: 557, src: 'v6.mp4' },  // трейлер
  { block: 3, x: 194,  y: 1231, w: 926, h: 440, src: 'v7.mp4' },  // клип
  { block: 3, x: 1152, y: 257,  w: 480, h: 530, src: 'v8.mp4' },  // телефон
  { block: 3, x: 1152, y: 962,  w: 480, h: 360, src: 'v9.mp4' },  // флэтлей

  /* ============ БЛОК 4 · «Примеры проектов» ============ */
  { block: 4, x: 944,  y: 1536, w: 656, h: 433, src: 'v10.mp4' },

];

const MAKEW = 1792;   // ширина макета, под которую заданы координаты

/* ---------- расстановка ---------- */
document.querySelectorAll('.block').forEach(blockEl => {
  const num = +blockEl.dataset.block;
  const img = blockEl.querySelector('img');
  const list = VIDEOS.filter(v => v.block === num);
  if (!list.length) return;

  list.forEach(v => {
    const el = document.createElement('div');
    el.className = 'slot';
    el.dataset.src = v.src;

    const place = () => {
      const k = blockEl.clientWidth / MAKEW;
      el.style.left   = (v.x * k) + 'px';
      el.style.top    = (v.y * k) + 'px';
      el.style.width  = (v.w * k) + 'px';
      el.style.height = (v.h * k) + 'px';
    };
    place();

    const vid = document.createElement('video');
    vid.src = 'img/' + v.src;
    vid.muted = true;
    vid.loop = true;
    vid.playsInline = true;
    vid.setAttribute('playsinline','');
    vid.preload = 'none';
    vid.setAttribute('aria-label','Видео проекта');

    vid.addEventListener('loadeddata', () => {
      el.classList.add('on');
      // если координаты совпали с реальным белым прямоугольником — ок
    });
    vid.addEventListener('error', () => {
      el.classList.remove('on');
      el.classList.add('empty');
    });

    el.appendChild(vid);
    blockEl.appendChild(el);

    // пересчёт при изменении ширины
    new ResizeObserver(place).observe(blockEl);

    /* ленивая загрузка: грузим только когда блок близко к экрану */
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (!e.isIntersecting) { vid.pause(); return; }
          if (!vid.dataset.started) {
            vid.dataset.started = '1';
            vid.load();
          }
          vid.play().catch(()=>{});
        });
      }, { rootMargin: '300px' });
      io.observe(el);
    } else {
      vid.load();
    }
  });
});

/* ---------- клик по пустому слоту = играть ---------- */
document.addEventListener('click', (e) => {
  const slot = e.target.closest('.slot.empty');
  if (!slot) return;
  const v = slot.querySelector('video');
  if (!v) return;
  v.play().then(() => {
    slot.classList.remove('empty');
    slot.classList.add('on');
  }).catch(()=>{});
});

/* ---------- режим проверки: нажмите V ---------- */
let helpers = [];
document.addEventListener('keydown', (e) => {
  if (e.key !== 'v' && e.key !== 'V' && e.key !== 'м' && e.key !== 'М') return;
  if (helpers.length) { helpers.forEach(h => h.remove()); helpers = []; return; }
  document.querySelectorAll('.slot').forEach((slot) => {
    const box = document.createElement('div');
    const cs = getComputedStyle(slot);
    box.style.cssText = 'position:absolute;border:2px dashed #fddda1;pointer-events:none;z-index:9;' +
      'left:' + cs.left + ';top:' + cs.top + ';width:' + cs.width + ';height:' + cs.height;
    slot.parentElement.appendChild(box);
    helpers.push(box);
  });
});

</script>

</body>
</html>
